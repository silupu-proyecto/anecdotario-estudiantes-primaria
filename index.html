<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#01025d">
<title>Anecdotario · Colegio Proyecto</title>
<link rel="icon" href="logo.png">
<style>
  :root{
    --azul:#01025d; --guinda:#86021d; --fondo:#f3f4f9; --tarjeta:#fff; --texto:#1b1c2b;
    --suave:#6b6f86; --borde:#e2e4ee; --verde:#1e7d3a; --verde-bg:#e6f4ea;
    --ambar:#a76200; --ambar-bg:#fff4dc; --rojo:#b3261e; --rojo-bg:#fce8e6;
  }
  *{box-sizing:border-box}
  html,body{margin:0;background:var(--fondo);color:var(--texto);
    font:16px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
  button{font:inherit;cursor:pointer}
  .oculto{display:none!important}

  /* Login */
  #login{position:fixed;inset:0;z-index:50;background:var(--fondo);display:flex;align-items:center;justify-content:center;padding:24px}
  .caja-login{background:var(--tarjeta);border-radius:20px;padding:32px 24px;max-width:380px;width:100%;
    text-align:center;box-shadow:0 10px 30px rgba(1,2,93,.10)}
  .caja-login img{width:86px;height:86px;object-fit:contain}
  .caja-login h1{margin:12px 0 4px;color:var(--azul);font-size:24px}
  .caja-login p{margin:0 0 22px;color:var(--suave)}
  #formLogin{display:flex;flex-direction:column;gap:10px;text-align:left}
  #formLogin label{font-size:13px;font-weight:600;color:var(--azul)}
  #formLogin input{width:100%;padding:12px;border:1px solid var(--borde);border-radius:10px;font:inherit}
  #btnEntrar{margin-top:6px;background:var(--guinda);color:#fff;border:0;border-radius:12px;padding:13px;font-weight:700}
  #btnEntrar:disabled{background:#c9cad6}
  #msgLogin{margin-top:12px;color:var(--rojo);font-size:14px;min-height:1em}

  /* Encabezado */
  header{position:sticky;top:0;z-index:10;background:var(--azul);color:#fff;
    padding:10px 16px;display:flex;align-items:center;gap:12px;
    padding-top:max(10px,env(safe-area-inset-top))}
  header img{width:36px;height:36px;object-fit:contain;background:#fff;border-radius:50%;padding:3px}
  .quien{flex:1;min-width:0}
  .quien b{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .quien span{font-size:13px;opacity:.85}
  #btnSalir{background:transparent;border:1px solid rgba(255,255,255,.45);color:#fff;border-radius:8px;padding:6px 10px;font-size:13px}

  main{max-width:760px;margin:0 auto;padding:14px 14px 120px}
  .tarjeta{background:var(--tarjeta);border-radius:16px;padding:14px;margin-bottom:14px;box-shadow:0 1px 3px rgba(0,0,0,.05)}
  .tarjeta h2{margin:0 0 10px;font-size:15px;color:var(--azul);display:flex;align-items:center;gap:8px}
  .num{background:var(--azul);color:#fff;width:22px;height:22px;border-radius:50%;display:inline-flex;
    align-items:center;justify-content:center;font-size:12px}
  .derecha{margin-left:auto;font-weight:400;font-size:13px}
  .link{background:none;border:0;color:var(--guinda);padding:0;text-decoration:underline}

  /* Secciones */
  #secciones{display:flex;gap:8px;overflow-x:auto;padding-bottom:2px}
  .chip{flex:0 0 auto;border:2px solid var(--borde);background:#fff;border-radius:999px;padding:8px 16px;font-weight:600;color:var(--azul)}
  .chip.activo{background:var(--azul);border-color:var(--azul);color:#fff}

  /* Alumnos */
  #buscar{width:100%;padding:10px 12px;border:1px solid var(--borde);border-radius:10px;margin-bottom:10px;font:inherit}
  #alumnos{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px}
  .alumno{text-align:left;border:2px solid var(--borde);background:#fff;border-radius:12px;padding:8px 10px;min-height:56px;position:relative}
  .alumno b{display:block;font-size:13px;color:var(--azul);letter-spacing:.2px}
  .alumno span{font-size:13px;color:var(--suave)}
  .alumno.sel{border-color:var(--guinda);background:#fbeef1}
  .alumno.sel::after{content:"✓";position:absolute;top:6px;right:8px;color:var(--guinda);font-weight:700}

  /* Anotación */
  .pestanas{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:10px}
  .pestana{border:2px solid var(--borde);background:#fff;border-radius:12px;padding:10px;font-weight:700}
  .pestana.activo.logro{border-color:var(--verde);background:var(--verde-bg);color:var(--verde)}
  .pestana.activo.mejorar{border-color:var(--guinda);background:#fbeef1;color:var(--guinda)}
  .grupo{font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:.5px;margin:12px 0 6px;color:var(--suave)}
  .opciones{display:flex;flex-wrap:wrap;gap:8px}
  .opcion{border:2px solid var(--borde);background:#fff;border-radius:10px;padding:9px 12px;text-align:left;font-size:14px}
  .opcion.Leve{border-left:6px solid #d6d8e3}
  .opcion.Moderado{border-left:6px solid #f0b400}
  .opcion.Grave{border-left:6px solid var(--rojo)}
  .opcion.Logro{border-left:6px solid var(--verde)}
  .opcion.sel{background:var(--azul);color:#fff;border-color:var(--azul)}
  .opcion.sel::before{content:"✓ ";font-weight:700}
  .cuenta{display:inline-block;min-width:20px;padding:0 6px;margin-left:4px;border-radius:999px;
    background:currentColor;font-size:12px;line-height:20px}
  .cuenta span{color:#fff}
  #elegidas{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
  #elegidas:empty{display:none}
  .etiqueta{background:#eef0f8;color:var(--azul);border-radius:999px;padding:4px 10px;font-size:13px}
  .etiqueta button{background:none;border:0;color:var(--guinda);padding:0 0 0 6px;font-weight:700}
  textarea{width:100%;margin-top:12px;border:1px solid var(--borde);border-radius:10px;padding:10px;font:inherit;resize:vertical;min-height:60px}

  /* Hoy */
  .registro{display:flex;gap:10px;align-items:flex-start;padding:10px 0;border-top:1px solid var(--borde)}
  .registro:first-child{border-top:0}
  .punto{width:10px;height:10px;border-radius:50%;margin-top:6px;flex:0 0 auto}
  .registro .info{flex:1;font-size:14px}
  .registro .info small{color:var(--suave)}
  .borrar{background:none;border:0;color:var(--rojo);font-size:20px;line-height:1;padding:2px 6px}
  .vacio{color:var(--suave);font-size:14px;margin:0}

  /* Barra inferior */
  #barra{position:fixed;left:0;right:0;bottom:0;background:#fff;border-top:1px solid var(--borde);
    padding:10px 14px max(10px,env(safe-area-inset-bottom));z-index:10}
  #barra .dentro{max-width:760px;margin:0 auto;display:flex;gap:10px;align-items:center}
  #resumen{flex:1;font-size:13px;color:var(--suave);min-width:0}
  #btnGuardar{background:var(--guinda);color:#fff;border:0;border-radius:12px;padding:13px 20px;font-weight:700;min-width:150px}
  #btnGuardar:disabled{background:#c9cad6}

  #toast{position:fixed;left:50%;bottom:90px;transform:translateX(-50%);background:var(--texto);color:#fff;
    padding:10px 16px;border-radius:10px;font-size:14px;z-index:60;max-width:90%;text-align:center}
  #toast.error{background:var(--rojo)}
  #cargando{text-align:center;color:var(--suave);padding:20px}

  /* Pestañas de vista (solo tutores) */
  #vistas{position:sticky;top:56px;z-index:9;background:var(--azul);display:flex;gap:4px;padding:0 12px 8px}
  #vistas button{flex:1;max-width:220px;border:0;border-radius:10px;padding:8px;font-weight:700;font-size:14px;
    background:rgba(255,255,255,.12);color:#fff}
  #vistas button.activo{background:#fff;color:var(--azul)}

  /* Reporte semanal */
  .semana{display:flex;align-items:center;gap:8px}
  .semana button{border:2px solid var(--borde);background:#fff;border-radius:10px;width:42px;height:40px;font-weight:700;color:var(--azul)}
  .semana button:disabled{opacity:.35}
  .semana .txt{flex:1;text-align:center}
  .semana .txt b{display:block;color:var(--azul)}
  .semana .txt small{color:var(--suave)}
  .interruptor{display:flex;align-items:center;gap:10px;margin-top:12px;font-size:14px}
  .interruptor input{width:20px;height:20px;accent-color:var(--guinda)}
  #repFiltros{display:flex;gap:6px;overflow-x:auto;margin-bottom:10px}
  .filtro{flex:0 0 auto;border:2px solid var(--borde);background:#fff;border-radius:999px;padding:6px 12px;font-size:13px;font-weight:600;color:var(--azul)}
  .filtro.activo{background:var(--azul);border-color:var(--azul);color:#fff}
  #repBuscar{width:100%;padding:10px 12px;border:1px solid var(--borde);border-radius:10px;margin-bottom:10px;font:inherit}
  .rep-alumno{border:2px solid var(--borde);border-radius:12px;margin-bottom:8px;overflow:hidden}
  .rep-cab{display:flex;align-items:center;gap:10px;width:100%;background:#fff;border:0;padding:10px 12px;text-align:left}
  .rep-cab .nom{flex:1;min-width:0}
  .rep-cab .nom b{display:block;font-size:13px;color:var(--azul)}
  .rep-cab .nom span{font-size:13px;color:var(--suave)}
  .cuentas{font-size:13px;white-space:nowrap;color:var(--suave)}
  .estado{font-size:12px;font-weight:700;border-radius:999px;padding:3px 8px;white-space:nowrap}
  .estado.pendiente{background:var(--ambar-bg);color:var(--ambar)}
  .estado.enviado{background:var(--verde-bg);color:var(--verde)}
  .estado.sinCorreo{background:#eceef5;color:var(--suave)}
  .estado.nada{background:#eceef5;color:var(--suave)}
  .rep-det{border-top:1px solid var(--borde);padding:8px 12px 12px;background:#fafbfe}
  .rep-reg{display:flex;gap:10px;padding:8px 0;border-bottom:1px dashed var(--borde);font-size:14px}
  .rep-reg:last-of-type{border-bottom:0}
  .rep-reg.excluido .info{opacity:.45;text-decoration:line-through}
  .rep-reg .info{flex:1;min-width:0}
  .rep-reg small{display:block;color:var(--suave)}
  .rep-reg em{display:block;color:#444;font-size:13px}
  .tag{display:inline-block;font-size:11px;font-weight:700;border-radius:6px;padding:1px 6px;margin-left:4px;vertical-align:middle}
  .tag.ant{background:#eef0f8;color:var(--azul)}
  .tag.env{background:var(--verde-bg);color:var(--verde)}
  .btn-mini{flex:0 0 auto;align-self:center;border:1px solid var(--borde);background:#fff;border-radius:8px;padding:5px 8px;font-size:12px;color:var(--suave)}
  .correos{font-size:13px;color:var(--suave);margin:8px 0;word-break:break-all}
  .acciones{display:flex;gap:8px;margin-top:8px}
  .btn{flex:1;border-radius:10px;padding:10px;font-weight:700;font-size:14px;border:2px solid var(--azul);background:#fff;color:var(--azul)}
  .btn.primario{background:var(--guinda);border-color:var(--guinda);color:#fff}
  .btn:disabled{opacity:.45}
  .btn-wa{display:flex;align-items:center;justify-content:center;gap:6px;margin-top:8px;width:100%;
    border-radius:10px;padding:11px;font-weight:700;font-size:14px;background:#1fa855;color:#fff;text-decoration:none}
  .btn-wa.reenviar{background:#fff;color:#1a8d47;border:2px solid #1fa855}
  .tag.wa{background:#e3f6ea;color:#1a8d47}
  .sin-cel{font-size:13px;color:var(--suave);margin-top:8px}
  .pie-rep{font-size:13px;color:var(--suave);text-align:center;margin:6px 0 0}
  #barraReporte{position:fixed;left:0;right:0;bottom:0;background:#fff;border-top:1px solid var(--borde);
    padding:10px 14px max(10px,env(safe-area-inset-bottom));z-index:10}
  #barraReporte .dentro{max-width:760px;margin:0 auto;display:flex;gap:10px;align-items:center}
  #repResumen{flex:1;font-size:13px;color:var(--suave);min-width:0}
  #btnEnviarTodos{background:var(--guinda);color:#fff;border:0;border-radius:12px;padding:13px 16px;font-weight:700}
  #btnEnviarTodos:disabled{background:#c9cad6}

  /* Vista previa */
  #modal{position:fixed;inset:0;z-index:70;background:rgba(10,12,40,.55);display:flex;align-items:flex-end;justify-content:center}
  .modal-caja{background:#fff;width:100%;max-width:680px;max-height:92vh;border-radius:18px 18px 0 0;display:flex;flex-direction:column;overflow:hidden}
  @media (min-width:700px){#modal{align-items:center}.modal-caja{border-radius:18px}}
  .modal-cab{padding:12px 16px;border-bottom:1px solid var(--borde);font-size:13px;color:var(--suave)}
  .modal-cab b{color:var(--texto)}
  #modalMarco{flex:1;width:100%;min-height:50vh;border:0;background:#f3f4f9}
  .modal-pie{display:flex;gap:8px;padding:10px 16px max(10px,env(safe-area-inset-bottom));border-top:1px solid var(--borde)}
</style>
</head>
<body>

<!-- Pantalla de inicio de sesión -->
<div id="login">
  <div class="caja-login">
    <img src="logo.png" alt="Logo del colegio">
    <h1>Anecdotario</h1>
    <p>Ingresa con tu correo del colegio</p>
    <form id="formLogin" autocomplete="on">
      <label for="correo">Correo</label>
      <input id="correo" type="text" inputmode="email" autocapitalize="none" autocorrect="off" spellcheck="false" autocomplete="username"
             placeholder="usuario@colegioproyecto.com" required>
      <label for="pin">PIN</label>
      <input id="pin" type="password" inputmode="numeric" autocomplete="current-password"
             maxlength="6" placeholder="Tu PIN de 4 dígitos">
      <button id="btnEntrar" type="submit">Entrar</button>
    </form>
    <div id="msgLogin"></div>
  </div>
</div>

<!-- Aplicación -->
<div id="app" class="oculto">
  <header>
    <img src="logo.png" alt="">
    <div class="quien"><b id="nombreDocente">—</b><span id="cursoDocente"></span></div>
    <button id="btnSalir">Salir</button>
  </header>
  <nav id="vistas" class="oculto">
    <button data-vista="registrar" class="activo">✏️ Registrar</button>
    <button data-vista="reporte">📨 Reporte semanal</button>
  </nav>

  <main id="vistaRegistrar">
    <div id="cargando">Cargando…</div>

    <div id="contenido" class="oculto">
      <section class="tarjeta" id="tarjetaSecciones">
        <h2>Sección</h2>
        <div id="secciones"></div>
      </section>

      <section class="tarjeta">
        <h2><span class="num">1</span> Alumno(s)
          <span class="derecha"><button class="link" id="btnLimpiar">Limpiar</button></span></h2>
        <input id="buscar" type="search" placeholder="Buscar alumno…" autocomplete="off">
        <div id="alumnos"></div>
      </section>

      <section class="tarjeta">
        <h2><span class="num">2</span> Anotación(es)
          <span class="derecha"><button class="link" id="btnLimpiarAcciones">Limpiar</button></span></h2>
        <div class="pestanas">
          <button class="pestana mejorar activo" data-tipo="A mejorar">📌 A mejorar</button>
          <button class="pestana logro" data-tipo="Logro">🌟 Logro</button>
        </div>
        <div id="opciones"></div>
        <div id="elegidas"></div>
        <textarea id="nota" maxlength="500" placeholder="Nota (opcional)"></textarea>
      </section>

      <section class="tarjeta">
        <h2>Registrado hoy por ti <span class="derecha" id="seccionHoy"></span></h2>
        <div id="hoy"><p class="vacio">Aún no hay registros.</p></div>
      </section>
    </div>
  </main>

  <!-- Vista del tutor: reporte semanal -->
  <div id="vistaReporte" class="oculto">
    <main>
      <section class="tarjeta">
        <div id="repSecciones" class="oculto" style="display:flex;gap:8px;overflow-x:auto;margin-bottom:12px"></div>
        <div class="semana">
          <button id="semAnt" aria-label="Semana anterior">◀</button>
          <div class="txt"><b id="semTxt">Semana</b><small id="semSub"></small></div>
          <button id="semSig" aria-label="Semana siguiente">▶</button>
        </div>
        <label class="interruptor">
          <input type="checkbox" id="incluirAnt">
          Incluir pendientes de semanas anteriores
        </label>
      </section>

      <section class="tarjeta">
        <div id="repFiltros"></div>
        <input id="repBuscar" type="search" placeholder="Buscar alumno…" autocomplete="off">
        <div id="repLista"><p class="vacio">Cargando…</p></div>
        <p class="pie-rep" id="repPie"></p>
      </section>
    </main>

    <div id="barraReporte">
      <div class="dentro">
        <div id="repResumen"></div>
        <button id="btnEnviarTodos" disabled>Enviar pendientes</button>
      </div>
    </div>
  </div>

  <div id="barra">
    <div class="dentro">
      <div id="resumen">Elige alumno(s) y una anotación</div>
      <button id="btnGuardar" disabled>Guardar</button>
    </div>
  </div>
</div>

<div id="modal" class="oculto">
  <div class="modal-caja" role="dialog" aria-modal="true">
    <div class="modal-cab">
      <div>Para: <b id="modalPara"></b></div>
      <div>Asunto: <b id="modalAsunto"></b></div>
    </div>
    <iframe id="modalMarco" sandbox="" title="Vista previa del correo"></iframe>
    <div class="modal-pie">
      <button class="btn" id="modalCerrar">Cerrar</button>
      <button class="btn primario" id="modalEnviar">Enviar</button>
    </div>
  </div>
</div>

<div id="toast" class="oculto"></div>

<script>
/* 👉 Pega aquí la URL /exec de Apps Script */
const API_URL = 'https://script.google.com/macros/s/AKfycbxVFIeZspYP0tkC5LNULkMA3T1i0xo3RruqeIUTSVST79DQgYfPFaPQCXaJw1_md5BuNg/exec';
const DOMINIO = '@colegioproyecto.com';

const $ = (id) => document.getElementById(id);
const estado = {
  token: null, docente: null, incidentes: [], seccion: null, alumnosPorSeccion: {}, vista: 'registrar',
  alumnos: [], seleccion: new Set(), tipo: 'A mejorar', acciones: new Set(), guardando: false
};
let ultimaSync = 0;
const MINUTOS_ENTRE_REVISIONES = 5;

/* ---------------- Sesión (correo + PIN) ---------------- */

function guardarLocal(clave, valor) { try { localStorage.setItem(clave, valor); } catch (e) {} }
function leerLocal(clave) { try { return localStorage.getItem(clave); } catch (e) { return null; } }
function borrarLocal(clave) { try { localStorage.removeItem(clave); } catch (e) {} }

$('formLogin').onsubmit = async (ev) => {
  ev.preventDefault();
  let correo = $('correo').value.trim().toLowerCase();
  if (correo && !correo.includes('@')) correo += DOMINIO; // permite escribir solo "csilupu"
  const pin = $('pin').value.trim();
  $('msgLogin').textContent = '';
  $('btnEntrar').disabled = true;
  $('btnEntrar').textContent = 'Entrando…';
  try {
    const r = await fetch(API_URL, {
      method: 'POST',
      headers: { 'Content-Type': 'text/plain;charset=utf-8' },
      body: JSON.stringify({ accion: 'entrar', correo, pin })
    });
    const res = await r.json();
    if (!res.ok) throw new Error(res.mensaje || 'No se pudo ingresar');
    // Si en este celular entra otro profesor, se reinicia la página para no mezclar datos
    if (estado.docente && estado.docente.correo !== correo) {
      guardarLocal('anec_token', res.token);
      guardarLocal('anec_correo', correo);
      location.reload();
      return;
    }
    estado.token = res.token;
    guardarLocal('anec_token', res.token);
    guardarLocal('anec_correo', correo);
    $('pin').value = '';
    $('login').classList.add('oculto');
    if (!estado.docente) iniciar(); else sincronizar();
  } catch (e) {
    $('msgLogin').textContent = e.message === 'Failed to fetch' ? 'Sin conexión. Inténtalo de nuevo.' : e.message;
  } finally {
    $('btnEntrar').disabled = false;
    $('btnEntrar').textContent = 'Entrar';
  }
};

function pedirLogin(mensaje) {
  estado.token = null;
  borrarLocal('anec_token');
  $('msgLogin').textContent = mensaje || '';
  $('correo').value = leerLocal('anec_correo') || '';
  $('login').classList.remove('oculto');
}

$('btnSalir').onclick = () => {
  // Al salir se borra también la lista guardada (por si el celular es compartido)
  borrarLocal(claveDatos());
  borrarLocal('anec_token');
  borrarLocal('anec_seccion');
  location.reload();
};

/* ---------------- Datos guardados en el navegador ---------------- */

function claveDatos() {
  return 'anec_datos_' + (leerLocal('anec_correo') || '');
}

function leerCache() {
  try { return JSON.parse(leerLocal(claveDatos()) || 'null'); } catch (e) { return null; }
}

function guardarCache(version, datos) {
  guardarLocal(claveDatos(), JSON.stringify({ version, datos, guardado: Date.now() }));
}

/* ---------------- API ---------------- */

async function api(accion, datos) {
  if (!estado.token) {
    pedirLogin('Vuelve a ingresar (no se pierde lo que marcaste).');
    throw new Error('sesion');
  }
  const r = await fetch(API_URL, {
    method: 'POST',
    headers: { 'Content-Type': 'text/plain;charset=utf-8' },
    body: JSON.stringify(Object.assign({ accion, token: estado.token }, datos || {}))
  });
  const res = await r.json();
  if (!res.ok) {
    if (res.codigo === 'token') { pedirLogin(res.mensaje); throw new Error('sesion'); }
    if (res.codigo === 'sin_permiso' || res.codigo === 'dominio') { pedirLogin(res.mensaje); throw new Error('sesion'); }
    const err = new Error(res.mensaje || 'Error del servidor');
    err.codigo = res.codigo;
    throw err;
  }
  return res;
}

function aviso(texto, error) {
  const t = $('toast');
  t.textContent = texto;
  t.className = error ? 'error' : '';
  clearTimeout(aviso._t);
  aviso._t = setTimeout(() => t.classList.add('oculto'), error ? 5000 : 2500);
}

/* ---------------- Inicio ---------------- */

async function iniciar() {
  $('app').classList.remove('oculto');
  // 1) Si hay datos guardados, se muestran al instante
  const cache = leerCache();
  if (cache && cache.datos) aplicarDatos(cache.datos, false);
  // 2) Por detrás se revisa el Sheets por si hubo cambios
  await sincronizar();
}

async function sincronizar(manual) {
  const cache = leerCache();
  try {
    const res = await api('datos', { version: cache && cache.version });
    ultimaSync = Date.now();
    if (res.sinCambios) {
      if (manual) aviso('✅ Todo al día, no hay cambios');
      return;
    }
    guardarCache(res.version, res.datos);
    const yaSeMostraba = !!estado.docente;
    aplicarDatos(res.datos, yaSeMostraba);
    if (yaSeMostraba) aviso('🔄 Lista actualizada');
  } catch (e) {
    if (e.message === 'sesion') return;
    const msg = e.message === 'Failed to fetch' ? 'No se pudo conectar con el Sheets' : e.message;
    if (!estado.docente) {
      $('cargando').textContent = '❌ ' + msg + '. Revisa tu internet y recarga la página.';
    } else {
      // Con datos guardados se sigue trabajando, pero se avisa que pueden estar desactualizados
      aviso('⚠️ ' + msg + '. La lista puede no estar actualizada.', true);
    }
  } finally {
    if (manual && estado.vista === 'reporte' && typeof cargarReporte === 'function') cargarReporte(true);
  }
}


function aplicarDatos(d, conservar) {
  estado.docente = d.docente;
  estado.incidentes = d.incidentes || [];
  estado.alumnosPorSeccion = d.alumnos || {};
  $('nombreDocente').textContent = d.docente.nombre;
  $('cursoDocente').textContent = d.docente.curso;

  if (!d.docente.secciones.length) {
    $('cargando').textContent = 'No tienes secciones asignadas. Pide a coordinación que revise la pestaña Docentes.';
    $('cargando').classList.remove('oculto');
    $('contenido').classList.add('oculto');
    return;
  }

  // Si alguna anotación elegida ya no existe, se deselecciona
  Array.from(estado.acciones).forEach((n) => {
    if (!estado.incidentes.some((i) => i.incidente === n)) estado.acciones.delete(n);
  });
  pintarSecciones();
  pintarOpciones();

  const preferida = conservar && estado.seccion ? estado.seccion : leerLocal('anec_seccion');
  const sec = d.docente.secciones.includes(preferida) ? preferida : d.docente.secciones[0];
  elegirSeccion(sec, conservar && sec === estado.seccion);

  $('cargando').classList.add('oculto');
  $('contenido').classList.remove('oculto');
  actualizarVistas();
}

function pintarSecciones() {
  const cont = $('secciones');
  cont.innerHTML = '';
  estado.docente.secciones.forEach((s) => {
    const b = document.createElement('button');
    b.className = 'chip';
    b.textContent = s;
    b.onclick = () => elegirSeccion(s);
    b.dataset.sec = s;
    cont.appendChild(b);
  });
  // Si solo tiene una sección, no hace falta mostrar el selector
  $('tarjetaSecciones').classList.toggle('oculto', estado.docente.secciones.length === 1);
}

// Cambiar de sección es instantáneo: los alumnos ya están en el navegador
function elegirSeccion(sec, conservarSeleccion) {
  const cambia = sec !== estado.seccion;
  estado.seccion = sec;
  estado.alumnos = estado.alumnosPorSeccion[sec] || [];

  if (conservarSeleccion) {
    const ids = new Set(estado.alumnos.map((a) => a.id));
    Array.from(estado.seleccion).forEach((id) => { if (!ids.has(id)) estado.seleccion.delete(id); });
  } else {
    estado.seleccion.clear();
  }

  guardarLocal('anec_seccion', sec);
  document.querySelectorAll('.chip').forEach((c) => c.classList.toggle('activo', c.dataset.sec === sec));
  $('seccionHoy').textContent = sec;
  pintarAlumnos();
  if (cambia) {
    $('hoy').innerHTML = '<p class="vacio">Cargando…</p>';
    cargarHoy();
  }
  actualizarBarra();
}

// Al volver a la app (por ejemplo, después de tenerla minimizada) se revisa si hubo cambios
document.addEventListener('visibilitychange', () => {
  if (document.visibilityState === 'visible' && estado.token && estado.docente &&
      Date.now() - ultimaSync > MINUTOS_ENTRE_REVISIONES * 60000) {
    sincronizar();
  }
});

/* ---------------- Alumnos ---------------- */

function pintarAlumnos() {
  const filtro = $('buscar').value.trim().toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g, '');
  const cont = $('alumnos');
  cont.innerHTML = '';
  const lista = estado.alumnos.filter((a) =>
    !filtro || a.nombre.toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g, '').includes(filtro));
  if (!estado.alumnos.length) { cont.innerHTML = '<p class="vacio">Esta sección no tiene alumnos en la lista.</p>'; return; }
  if (!lista.length) { cont.innerHTML = '<p class="vacio">Ningún alumno coincide.</p>'; return; }

  lista.forEach((a) => {
    const [apellidos, nombres] = a.nombre.split(', ');
    const b = document.createElement('button');
    b.className = 'alumno' + (estado.seleccion.has(a.id) ? ' sel' : '');
    const bb = document.createElement('b'); bb.textContent = apellidos || a.nombre;
    const sp = document.createElement('span'); sp.textContent = aTitulo(nombres || '');
    b.append(bb, sp);
    b.onclick = () => {
      estado.seleccion.has(a.id) ? estado.seleccion.delete(a.id) : estado.seleccion.add(a.id);
      b.classList.toggle('sel');
      actualizarBarra();
    };
    cont.appendChild(b);
  });
}

function aTitulo(s) {
  return s.toLowerCase().replace(/(^|\s)\S/g, (l) => l.toUpperCase());
}

$('buscar').oninput = pintarAlumnos;
$('btnLimpiar').onclick = () => { estado.seleccion.clear(); pintarAlumnos(); actualizarBarra(); };

/* ---------------- Anotaciones ---------------- */

document.querySelectorAll('.pestana').forEach((p) => {
  p.onclick = () => {
    // Cambiar de pestaña NO borra lo elegido: se puede marcar un logro y algo a mejorar a la vez
    estado.tipo = p.dataset.tipo;
    document.querySelectorAll('.pestana').forEach((x) => x.classList.toggle('activo', x === p));
    pintarOpciones();
  };
});

function pintarOpciones() {
  const cont = $('opciones');
  cont.innerHTML = '';
  const delTipo = estado.incidentes.filter((i) => i.tipo === estado.tipo);
  const grupos = estado.tipo === 'Logro' ? ['—'] : ['Leve', 'Moderado', 'Grave'];

  grupos.forEach((g) => {
    const items = delTipo.filter((i) => (estado.tipo === 'Logro') || i.gravedad === g);
    if (!items.length) return;
    if (estado.tipo !== 'Logro') {
      const t = document.createElement('div');
      t.className = 'grupo';
      t.textContent = g;
      cont.appendChild(t);
    }
    const caja = document.createElement('div');
    caja.className = 'opciones';
    items.forEach((i) => {
      const b = document.createElement('button');
      b.className = 'opcion ' + (estado.tipo === 'Logro' ? 'Logro' : i.gravedad) +
        (estado.acciones.has(i.incidente) ? ' sel' : '');
      b.textContent = i.incidente;
      b.onclick = () => {
        estado.acciones.has(i.incidente) ? estado.acciones.delete(i.incidente) : estado.acciones.add(i.incidente);
        b.classList.toggle('sel');
        pintarElegidas();
        actualizarBarra();
      };
      caja.appendChild(b);
    });
    cont.appendChild(caja);
  });
  pintarElegidas();
}

// Muestra lo elegido (de ambas pestañas) y el contador en cada pestaña
function pintarElegidas() {
  const cont = $('elegidas');
  cont.innerHTML = '';
  const tipoDe = (n) => (estado.incidentes.find((i) => i.incidente === n) || {}).tipo;
  estado.acciones.forEach((n) => {
    const e = document.createElement('span');
    e.className = 'etiqueta';
    e.textContent = (tipoDe(n) === 'Logro' ? '🌟 ' : '📌 ') + n;
    const x = document.createElement('button');
    x.textContent = '×';
    x.title = 'Quitar';
    x.onclick = () => { estado.acciones.delete(n); pintarOpciones(); actualizarBarra(); };
    e.appendChild(x);
    cont.appendChild(e);
  });
  document.querySelectorAll('.pestana').forEach((p) => {
    const n = Array.from(estado.acciones).filter((a) => tipoDe(a) === p.dataset.tipo).length;
    const base = p.dataset.tipo === 'Logro' ? '🌟 Logro' : '📌 A mejorar';
    p.textContent = base;
    if (n) {
      const c = document.createElement('span');
      c.className = 'cuenta';
      const t = document.createElement('span');
      t.textContent = n;
      c.appendChild(t);
      p.appendChild(c);
    }
  });
}

$('btnLimpiarAcciones').onclick = () => { estado.acciones.clear(); pintarOpciones(); actualizarBarra(); };

/* ---------------- Guardar ---------------- */

function actualizarBarra() {
  const n = estado.seleccion.size;
  const m = estado.acciones.size;
  const listo = n > 0 && m > 0 && !estado.guardando;
  $('btnGuardar').disabled = !listo;
  $('btnGuardar').textContent = estado.guardando ? 'Guardando…' : 'Guardar';
  const txtAlumnos = n === 1 ? '1 alumno' : n + ' alumnos';
  const txtAcciones = m === 1 ? Array.from(estado.acciones)[0] : m + ' anotaciones';
  $('resumen').textContent =
    !n && !m ? 'Elige alumno(s) y anotación(es)' :
    !n ? txtAcciones + ' · elige alumno(s)' :
    !m ? txtAlumnos + ' · elige anotación(es)' :
    txtAlumnos + ' · ' + txtAcciones;
}

$('btnGuardar').onclick = async () => {
  if (estado.guardando) return;
  estado.guardando = true;
  actualizarBarra();
  try {
    const res = await api('guardar', {
      seccion: estado.seccion,
      alumnos: Array.from(estado.seleccion),
      incidentes: Array.from(estado.acciones),
      nota: $('nota').value
    });
    aviso('✅ Guardado (' + res.guardados + (res.guardados === 1 ? ' registro)' : ' registros)'));
    estado.seleccion.clear();
    estado.acciones.clear();
    $('nota').value = '';
    $('buscar').value = '';
    pintarAlumnos();
    pintarOpciones();
    cargarHoy();
  } catch (e) {
    if (e.message === 'sesion') return;
    if (['alumnos', 'incidente', 'seccion'].includes(e.codigo)) {
      // La lista cambió en el Sheets: se actualiza y el profe revisa antes de volver a guardar
      aviso('La lista cambió en el colegio. Ya se actualizó: revisa y vuelve a guardar.', true);
      sincronizar();
    } else {
      aviso('❌ ' + (e.message === 'Failed to fetch' ? 'Sin conexión. No se guardó, inténtalo de nuevo.' : e.message), true);
    }
  } finally {
    estado.guardando = false;
    actualizarBarra();
  }
};

/* ---------------- Registrado hoy ---------------- */

async function cargarHoy() {
  const sec = estado.seccion;
  try {
    const res = await api('hoy', { seccion: sec });
    if (sec !== estado.seccion) return;
    const cont = $('hoy');
    cont.innerHTML = '';
    if (!res.registros.length) { cont.innerHTML = '<p class="vacio">Aún no hay registros.</p>'; return; }
    res.registros.forEach((r) => {
      const fila = document.createElement('div');
      fila.className = 'registro';
      const punto = document.createElement('span');
      punto.className = 'punto';
      punto.style.background = r.tipo === 'Logro' ? 'var(--verde)' :
        r.gravedad === 'Grave' ? 'var(--rojo)' : r.gravedad === 'Moderado' ? '#f0b400' : '#c4c6d3';
      const info = document.createElement('div');
      info.className = 'info';
      const t1 = document.createElement('div'); t1.textContent = r.alumno;
      const t2 = document.createElement('small');
      t2.textContent = r.hora + ' · ' + r.incidente + (r.nota ? ' · "' + r.nota + '"' : '');
      info.append(t1, t2);
      fila.append(punto, info);
      if (!r.enviado) {
        const x = document.createElement('button');
        x.className = 'borrar';
        x.title = 'Borrar';
        x.textContent = '×';
        x.onclick = () => borrarRegistro(r, x);
        fila.appendChild(x);
      }
      cont.appendChild(fila);
    });
  } catch (e) { /* silencioso */ }
}

async function borrarRegistro(r, boton) {
  if (!confirm('¿Borrar "' + r.incidente + '" de ' + r.alumno + '?')) return;
  boton.disabled = true;
  try {
    await api('borrar', { seccion: estado.seccion, id: r.id });
    aviso('Registro borrado');
    cargarHoy();
  } catch (e) {
    boton.disabled = false;
    if (e.message !== 'sesion') aviso('❌ ' + e.message, true);
  }
}

/* =================================================================== */
/* Reporte semanal (solo tutores)                                       */
/* =================================================================== */

const rep = {
  seccion: null, semana: null, datos: null, filtro: 'todos', abiertos: new Set(),
  incluirAnteriores: leerLocal('anec_incluirAnt') === '1', cargando: false, enviando: false,
  guardando: new Set(), // anotaciones cuyo "No enviar" se está guardando
  cambiosEnCurso: 0
};
$('incluirAnt').checked = rep.incluirAnteriores;

const ESTADOS = {
  pendiente: '🟡 Pendiente', enviado: '✅ Enviado', sinCorreo: '⚪ Sin correo', nada: '🚫 Todo excluido'
};

function esTutor() {
  return !!(estado.docente && estado.docente.tutorDe && estado.docente.tutorDe.length);
}

function actualizarVistas() {
  $('vistas').classList.toggle('oculto', !esTutor());
  if (!esTutor() && estado.vista === 'reporte') mostrarVista('registrar');
}

function mostrarVista(v) {
  estado.vista = v;
  document.querySelectorAll('#vistas button').forEach((b) => b.classList.toggle('activo', b.dataset.vista === v));
  $('vistaRegistrar').classList.toggle('oculto', v !== 'registrar');
  $('barra').classList.toggle('oculto', v !== 'registrar');
  $('vistaReporte').classList.toggle('oculto', v !== 'reporte');
  window.scrollTo(0, 0);
  if (v === 'reporte') abrirReporte();
}

document.querySelectorAll('#vistas button').forEach((b) => { b.onclick = () => mostrarVista(b.dataset.vista); });

function abrirReporte() {
  const tutorDe = estado.docente.tutorDe;
  if (!tutorDe.includes(rep.seccion)) {
    const guardada = leerLocal('anec_repSeccion');
    rep.seccion = tutorDe.includes(guardada) ? guardada : tutorDe[0];
  }
  // Selector de sección solo si es tutor de varias
  const cont = $('repSecciones');
  cont.innerHTML = '';
  cont.classList.toggle('oculto', tutorDe.length < 2);
  tutorDe.forEach((sec) => {
    const b = document.createElement('button');
    b.className = 'chip' + (sec === rep.seccion ? ' activo' : '');
    b.textContent = sec;
    b.onclick = () => {
      rep.seccion = sec;
      guardarLocal('anec_repSeccion', sec);
      cont.querySelectorAll('.chip').forEach((c) => c.classList.toggle('activo', c === b));
      cargarReporte();
    };
    cont.appendChild(b);
  });
  cargarReporte();
}

function sumarDias(fechaTxt, dias) {
  const [a, m, d] = fechaTxt.split('-').map(Number);
  const f = new Date(a, m - 1, d + dias, 12);
  return f.getFullYear() + '-' + String(f.getMonth() + 1).padStart(2, '0') + '-' + String(f.getDate()).padStart(2, '0');
}

$('semAnt').onclick = () => { if (rep.datos) { rep.semana = sumarDias(rep.datos.semana.lunes, -7); cargarReporte(); } };
$('semSig').onclick = () => { if (rep.datos) { rep.semana = sumarDias(rep.datos.semana.lunes, 7); cargarReporte(); } };
$('incluirAnt').onchange = () => {
  rep.incluirAnteriores = $('incluirAnt').checked;
  guardarLocal('anec_incluirAnt', rep.incluirAnteriores ? '1' : '0');
  cargarReporte();
};
$('repBuscar').oninput = pintarReporte;

// silencioso = true: actualiza por detrás sin "Cargando…", sin mover el scroll ni cerrar tarjetas
async function cargarReporte(silencioso) {
  const pedido = rep.seccion + '|' + rep.semana + '|' + rep.incluirAnteriores;
  if (silencioso && (!rep.datos || rep.cambiosEnCurso > 0)) return;
  rep.cargando = pedido;
  if (!silencioso) {
    $('repLista').innerHTML = '<p class="vacio">Cargando…</p>';
    $('repFiltros').innerHTML = '';
    $('btnEnviarTodos').disabled = true;
  }
  try {
    const res = await api('reporte', { seccion: rep.seccion, semana: rep.semana, incluirAnteriores: rep.incluirAnteriores });
    if (rep.cargando !== pedido) return; // llegó tarde una respuesta vieja
    // Si mientras tanto el tutor tachó algo, no se pisa su cambio: se espera a que termine
    if (silencioso && rep.cambiosEnCurso > 0) return;
    rep.datos = res;
    rep.semana = res.semana.lunes;
    pintarReporte(silencioso);
  } catch (e) {
    if (e.message !== 'sesion' && !silencioso) $('repLista').innerHTML = '<p class="vacio">❌ ' + e.message + '</p>';
  } finally {
    if (rep.cargando === pedido) rep.cargando = false;
  }
}

// Mismo criterio que el servidor (estadoDe_ en Reportes.gs)
function estadoLocal(a) {
  const pendientes = a.registros.filter((r) => !r.noEnviar && !r.enviado).length;
  if (!pendientes) return a.registros.some((r) => r.enviado) ? 'enviado' : 'nada';
  return a.correos.length ? 'pendiente' : 'sinCorreo';
}

function contar(alumnos) {
  const c = { todos: alumnos.length, pendiente: 0, enviado: 0, sinCorreo: 0 };
  alumnos.forEach((a) => { if (c[a.estado] !== undefined) c[a.estado]++; });
  return c;
}

function pintarReporte(conservarScroll) {
  const d = rep.datos;
  if (!d) return;
  const y = window.scrollY;
  const sem = d.semana;
  $('semTxt').textContent = 'Semana del ' + sem.etiqueta;
  $('semSub').textContent = rep.seccion + (sem.esActual ? ' · semana actual' : '');
  $('semSig').disabled = sem.esActual || sem.esFutura;

  // Filtros con contadores
  const c = contar(d.alumnos);
  const filtros = [['todos', 'Todos'], ['pendiente', '🟡 Pendientes'], ['enviado', '✅ Enviados'], ['sinCorreo', '⚪ Sin correo']];
  const cf = $('repFiltros');
  cf.innerHTML = '';
  filtros.forEach(([k, txt]) => {
    const b = document.createElement('button');
    b.className = 'filtro' + (rep.filtro === k ? ' activo' : '');
    b.textContent = txt + ' (' + c[k] + ')';
    b.onclick = () => { rep.filtro = k; pintarReporte(); };
    cf.appendChild(b);
  });

  // Lista
  const q = $('repBuscar').value.trim().toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g, '');
  const lista = d.alumnos.filter((a) =>
    (rep.filtro === 'todos' || a.estado === rep.filtro) &&
    (!q || a.nombre.toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g, '').includes(q)));
  const cont = $('repLista');
  cont.innerHTML = '';
  if (!d.alumnos.length) {
    cont.innerHTML = '<p class="vacio">No hay anotaciones en esta semana.</p>';
  } else if (!lista.length) {
    cont.innerHTML = '<p class="vacio">Ningún alumno en este filtro.</p>';
  }
  lista.forEach((a) => cont.appendChild(tarjetaAlumno(a)));

  $('repPie').textContent =
    (d.sinAnotaciones ? d.sinAnotaciones + ' alumno(s) sin anotaciones esta semana (no reciben correo). ' : '') +
    'Envíos disponibles hoy: ' + d.cuota + '.';

  // Barra inferior
  $('repResumen').textContent = c.pendiente
    ? c.pendiente + ' pendiente(s)' + (c.sinCorreo ? ' · ' + c.sinCorreo + ' sin correo' : '')
    : (c.todos ? 'Nada pendiente por enviar' : '');
  $('btnEnviarTodos').disabled = !c.pendiente || rep.enviando || rep.cambiosEnCurso > 0;
  $('btnEnviarTodos').textContent = rep.enviando ? 'Enviando…' : 'Enviar pendientes (' + c.pendiente + ')';
  if (conservarScroll) window.scrollTo(0, y);
}

function tarjetaAlumno(a) {
  const caja = document.createElement('div');
  caja.className = 'rep-alumno';

  const logros = a.registros.filter((r) => r.tipo === 'Logro' && !r.noEnviar).length;
  const mejorar = a.registros.filter((r) => r.tipo !== 'Logro' && !r.noEnviar).length;
  const [apellidos, nombres] = a.nombre.split(', ');

  const cab = document.createElement('button');
  cab.className = 'rep-cab';
  const nom = document.createElement('div');
  nom.className = 'nom';
  const b = document.createElement('b'); b.textContent = apellidos || a.nombre;
  const sp = document.createElement('span'); sp.textContent = aTitulo(nombres || '');
  nom.append(b, sp);
  const cu = document.createElement('span');
  cu.className = 'cuentas';
  cu.textContent = '🌟 ' + logros + ' · 📌 ' + mejorar + (a.whatsapp && !a.whatsapp.pendientes ? ' · 💬✓' : '');
  const es = document.createElement('span');
  es.className = 'estado ' + a.estado;
  es.textContent = ESTADOS[a.estado] || a.estado;
  cab.append(nom, cu, es);
  cab.onclick = () => {
    rep.abiertos.has(a.id) ? rep.abiertos.delete(a.id) : rep.abiertos.add(a.id);
    det.classList.toggle('oculto');
  };
  caja.appendChild(cab);

  const det = document.createElement('div');
  det.className = 'rep-det' + (rep.abiertos.has(a.id) ? '' : ' oculto');

  a.registros.forEach((r) => {
    const fila = document.createElement('div');
    fila.className = 'rep-reg' + (r.noEnviar ? ' excluido' : '');
    const info = document.createElement('div');
    info.className = 'info';
    const t = document.createElement('div');
    t.textContent = (r.tipo === 'Logro' ? '🌟 ' : r.gravedad === 'Grave' ? '🔴 ' : '📌 ') + r.incidente;
    if (r.anterior) { const g = document.createElement('span'); g.className = 'tag ant'; g.textContent = 'semana anterior'; t.appendChild(g); }
    if (r.enviado) { const g = document.createElement('span'); g.className = 'tag env'; g.textContent = '📧 ' + r.enviado; t.appendChild(g); }
    if (r.whatsapp) { const g = document.createElement('span'); g.className = 'tag wa'; g.textContent = '💬 ' + r.whatsapp; t.appendChild(g); }
    const sm = document.createElement('small');
    sm.textContent = r.dia + ' ' + r.hora + ' · ' + r.curso + ' · ' + r.docente;
    info.append(t, sm);
    if (r.nota) { const em = document.createElement('em'); em.textContent = '“' + r.nota + '”'; info.appendChild(em); }
    fila.appendChild(info);
    if (!r.enviado) {
      const x = document.createElement('button');
      x.className = 'btn-mini';
      x.textContent = r.noEnviar ? 'Incluir' : 'No enviar';
      x.disabled = rep.guardando.has(r.id);
      x.onclick = () => cambiarNoEnviar(a, r);
      fila.appendChild(x);
    }
    det.appendChild(fila);
  });

  const co = document.createElement('div');
  co.className = 'correos';
  co.textContent = a.correos.length ? '📧 ' + a.correos.join(', ')
    : (a.enLista ? '📧 Sin correo de los padres. Complétalo desde Fichas.' : '⚠️ Este alumno ya no está en la lista de la sección.');
  det.appendChild(co);

  if (a.correos.length && a.estado !== 'nada') {
    const reenviar = a.estado === 'enviado';
    const acc = document.createElement('div');
    acc.className = 'acciones';
    const bv = document.createElement('button');
    bv.className = 'btn';
    bv.textContent = '👁 Vista previa';
    bv.onclick = () => vistaPrevia(a, reenviar, bv);
    const be = document.createElement('button');
    be.className = 'btn primario';
    be.textContent = reenviar ? 'Reenviar' : 'Enviar a sus padres';
    be.onclick = () => enviarUno(a, reenviar);
    acc.append(bv, be);
    det.appendChild(acc);
  }

  // WhatsApp: se abre en el celular del tutor con el mensaje ya escrito
  if (a.whatsapp) {
    const w = a.whatsapp;
    const link = document.createElement('a');
    const reenviar = !w.pendientes;
    link.className = 'btn-wa' + (reenviar ? ' reenviar' : '');
    link.href = 'https://wa.me/' + w.celular + '?text=' + encodeURIComponent(w.texto);
    link.target = '_blank';
    link.rel = 'noopener';
    link.textContent = (reenviar ? '💬 Reenviar WhatsApp a ' : '💬 Enviar WhatsApp a ') + w.para +
      (w.ultimo ? ' (último: ' + w.ultimo + ')' : '');
    link.onclick = () => marcarWhatsApp(w.ids);
    det.appendChild(link);
  } else if (a.enLista && a.estado !== 'nada') {
    const sc = document.createElement('div');
    sc.className = 'sin-cel';
    sc.textContent = '💬 Sin celular de los padres. Complétalo desde Fichas.';
    det.appendChild(sc);
  }
  caja.appendChild(det);
  return caja;
}

// Se registra al abrir WhatsApp (el envío final lo hace el tutor en su celular)
async function marcarWhatsApp(ids) {
  try {
    await api('marcarWhatsApp', { seccion: rep.seccion, ids });
    setTimeout(() => cargarReporte(true), 1500);
  } catch (e) {
    if (e.message !== 'sesion') aviso('No se pudo registrar el envío por WhatsApp: ' + e.message, true);
  }
}

// Actualización optimista: se tacha al instante y se guarda por detrás
async function cambiarNoEnviar(a, r) {
  if (rep.guardando.has(r.id)) return;
  const valor = !r.noEnviar;
  const aplicar = (v) => {
    r.noEnviar = v;
    a.estado = estadoLocal(a);
    // El texto de WhatsApp se recalcula en el servidor; mientras tanto se oculta si ya no queda nada
    if (a.whatsapp && !a.registros.some((x) => !x.noEnviar)) a.whatsapp = null;
    pintarReporte(true);
  };

  rep.guardando.add(r.id);
  rep.cambiosEnCurso++;
  aplicar(valor);
  try {
    await api('noEnviar', { seccion: rep.seccion, id: r.id, valor });
  } catch (e) {
    aplicar(!valor); // se revierte
    if (e.message !== 'sesion') aviso('❌ No se pudo guardar: ' + e.message, true);
  } finally {
    rep.guardando.delete(r.id);
    rep.cambiosEnCurso--;
    pintarReporte(true);
    // Cuando terminan todos los cambios, se sincroniza en silencio (actualiza el texto de WhatsApp)
    if (rep.cambiosEnCurso === 0) cargarReporte(true);
  }
}

/* ---- Vista previa ---- */

let enviarDesdeModal = null;

async function vistaPrevia(a, reenviar, boton) {
  boton.disabled = true;
  try {
    const res = await api('vistaPrevia', {
      seccion: rep.seccion, semana: rep.semana, incluirAnteriores: rep.incluirAnteriores, alumnoId: a.id, reenviar
    });
    $('modalPara').textContent = res.para.join(', ');
    $('modalAsunto').textContent = res.asunto;
    $('modalMarco').srcdoc = res.html;
    $('modalEnviar').textContent = reenviar ? 'Reenviar' : 'Enviar';
    enviarDesdeModal = () => enviarUno(a, reenviar);
    $('modal').classList.remove('oculto');
  } catch (e) {
    if (e.message !== 'sesion') aviso('❌ ' + e.message, true);
  } finally {
    boton.disabled = false;
  }
}

function cerrarModal() {
  $('modal').classList.add('oculto');
  $('modalMarco').srcdoc = '';
  enviarDesdeModal = null;
}
$('modalCerrar').onclick = cerrarModal;
$('modal').onclick = (ev) => { if (ev.target === $('modal')) cerrarModal(); };
$('modalEnviar').onclick = () => { const f = enviarDesdeModal; cerrarModal(); if (f) f(); };

/* ---- Envío ---- */

async function enviarUno(a, reenviar) {
  const txt = (reenviar ? '¿Reenviar' : '¿Enviar') + ' el reporte de ' + a.nombre + ' a:\n' + a.correos.join('\n') + '?';
  if (!confirm(txt)) return;
  await enviar([a.id], reenviar);
}

$('btnEnviarTodos').onclick = async () => {
  const pendientes = rep.datos.alumnos.filter((a) => a.estado === 'pendiente');
  if (!pendientes.length) return;
  if (!confirm('¿Enviar el reporte a los padres de ' + pendientes.length + ' alumno(s)?\n\n' +
      'Cada familia recibe solo el correo de su hijo(a).')) return;
  await enviar(pendientes.map((a) => a.id), false);
};

async function enviar(ids, reenviar) {
  if (rep.enviando) return;
  rep.enviando = true;
  pintarReporte();
  aviso('Enviando… no cierres la app');
  try {
    const res = await api('enviar', {
      seccion: rep.seccion, semana: rep.semana, incluirAnteriores: rep.incluirAnteriores, alumnos: ids, reenviar
    });
    const partes = ['✅ Enviados: ' + res.enviados];
    if (res.sinCorreo) partes.push(res.sinCorreo + ' sin correo');
    if (res.faltan) partes.push('faltan ' + res.faltan + ': vuelve a pulsar Enviar pendientes');
    if (res.errores.length) partes.push(res.errores.length + ' con error (' + res.errores.map((x) => x.nombre).join(', ') + ')');
    aviso(partes.join(' · '), res.errores.length > 0 || res.faltan > 0);
  } catch (e) {
    if (e.message !== 'sesion') {
      aviso('❌ ' + (e.message === 'Failed to fetch'
        ? 'Se perdió la conexión. Revisa la lista antes de reintentar: algunos pueden haberse enviado.' : e.message), true);
    }
  } finally {
    rep.enviando = false;
    cargarReporte(true);
  }
}

/* ---------------- Arranque ---------------- */

  $('correo').value = leerLocal('anec_correo') || '';
  const t = leerLocal('anec_token');
  if (t) {
    estado.token = t;
    $('login').classList.add('oculto');
    iniciar();
  }
})();
